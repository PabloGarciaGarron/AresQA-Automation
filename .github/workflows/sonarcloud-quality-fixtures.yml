name: SonarCloud quality fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Java for SonarScanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin SonarCloud analysis
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          : "${SONAR_ORGANIZATION:?Configure the SONAR_ORGANIZATION repository variable}"
          : "${SONAR_PROJECT_KEY:?Configure the SONAR_PROJECT_KEY repository variable}"
          : "${SONAR_TOKEN:?Configure the SONAR_TOKEN repository secret}"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="work/quality-fixtures/coverage.opencover.xml"

      - name: Build solution
        run: dotnet build AresQA-Web/AresQA.sln --no-incremental

      - name: Run fixture tests and create OpenCover report
        run: >
          dotnet test tests/QualityFixtures.Tests/AresQA.QualityFixtures.Tests.csproj
          --no-build
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=opencover
          -p:CoverletOutput=../../work/quality-fixtures/coverage

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
